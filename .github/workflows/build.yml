name: Build
jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          java: '8'
      fail-fast: false
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5.6.0
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
        cache: maven
    - name: Maven Compile
      run: mvn -X compile -B --file pom.xml
    - name: Maven Verify
      run: mvn -X verify -B --file pom.xml
    timeout-minutes: 12
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push: null
  pull_request: null
